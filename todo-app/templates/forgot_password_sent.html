{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
  <div class="auth-card">
    <h2>Check your email</h2>
    <p class="auth-sub">If that email matches an account, a reset link has been sent and expires in 30 minutes.</p>

    {% if demo_link %}
      <div class="demo-box">
        <p><strong>Local demo mode:</strong> </p>
        <a href="{{ demo_link }}">{{ demo_link }}</a>
      </div>
    {% endif %}

    <p class="auth-sub"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
  </div>
{% endblock %}
