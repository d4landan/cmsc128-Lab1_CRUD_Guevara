{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="auth-sub">New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>

    <form method="POST" class="auth-form" novalidate>
      <label>
        <span>Email</span>
        <input type="email" name="email" value="{{ email or '' }}" required autofocus>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn-primary">Log in</button>
    </form>
    <p class="auth-sub"><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
  </div>
{% endblock %}
