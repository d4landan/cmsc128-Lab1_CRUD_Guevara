{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <div class="auth-card error-card">
    <p class="error-code" aria-hidden="true">{{ code }}</p>
    <h2>{{ title }}</h2>
    <p class="auth-sub">{{ message }}</p>
    <p>
      {% if current_user.is_authenticated %}
        <a class="btn-primary btn-link" href="{{ url_for('index') }}">Back to my tasks</a>
      {% else %}
        <a class="btn-primary btn-link" href="{{ url_for('auth.login') }}">Go to log in</a>
      {% endif %}
    </p>
  </div>
{% endblock %}
